name: Build, push, and deploy hosted agent (Foundry, anonymous self-hosted registry pull)

# Proves a Microsoft Foundry hosted agent can pull its container image from a self-hosted,
# UNAUTHENTICATED Docker Registry with NO Foundry registry connection and NO OIDC token exchange
# configured -- see infra/hosted-agent/main.tf, whose container_configuration block omits
# registry_connection_id entirely.
#
# The build job runs on a GitHub-hosted runner (pushes over plain HTTP to the anonymous registry).
# The deploy job runs on a PRIVATE self-hosted runner (label: byor-private, VM:
# byor-ci-docker-runner-01) because this repo's Terraform state lives in a storage account with
# public network access disabled, reachable only via that runner's private endpoint -- the same
# pattern byor-agent uses. This is a secondary, pragmatic choice (state-account network access),
# unrelated to the actual proof point above.

on:
  push:
    branches: [main]
    paths:
      - app.py
      - knowledge/**
      - requirements.txt
      - Dockerfile
      - infra/hosted-agent/**
      - scripts/test-hosted-agent.py
      - .github/workflows/deploy-agent.yml
  workflow_dispatch:
    inputs:
      image_digest:
        description: "Optional: deploy an existing registry image digest instead of building (leave empty to build)"
        required: false
        default: ""

permissions:
  id-token: write
  contents: read

concurrency:
  group: docker-registry-hosted-agent-deployment
  cancel-in-progress: false

env:
  # NOTE: no ":5000" port here. Foundry's hosted-agent image validator rejects any image
  # reference with an explicit registry port ("Must be a valid container image in the format
  # '<registry>/<repository>[:<tag>|@<digest>]'" -- confirmed by direct API testing: the exact
  # same image string with vs. without "<host>:<port>" was accepted/rejected respectively, with
  # no other difference). The self-hosted registry now sits behind a Caddy TLS reverse proxy on
  # the standard HTTPS port (443, implicit/default -- no port needed in the reference), so this
  # must be a real registry/repository, not host:port/repository.
  REGISTRY_HOST: byor-anon-registry.eastus.azurecontainer.io
  IMAGE_NAME: byor-agent-docker

jobs:
  build:
    name: Build and push image to the self-hosted anonymous registry
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.digest.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Use provided digest instead of building
        if: inputs.image_digest != ''
        run: echo "ok"

      # No insecure-registry/daemon.json workaround needed: the registry sits behind a Caddy
      # TLS proxy with a real Let's Encrypt certificate on the standard HTTPS port, so Docker's
      # normal (secure) registry client works unmodified -- this is exactly how Foundry's own
      # hosted-agent runtime will pull it too.
      - name: Set up Docker Buildx
        if: inputs.image_digest == ''
        uses: docker/setup-buildx-action@v3

      - name: Build and push (linux/amd64)
        if: inputs.image_digest == ''
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY_HOST }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}

      - name: Smoke test pushed image
        if: inputs.image_digest == ''
        run: |
          image="${{ env.REGISTRY_HOST }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}"
          cid=$(docker run -d --rm -p 8088:8088 "$image")
          trap 'docker stop "$cid" >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8088/readiness >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://localhost:8088/readiness
          curl -fsS -X POST http://localhost:8088/responses \
            -H 'Content-Type: application/json' \
            -d '{"input":"Foundry image smoke test"}' | tee /tmp/resp.json
          python3 -c 'import json; r=json.load(open("/tmp/resp.json")); assert r["status"] == "completed" and r["output_text"], r'
          docker stop "$cid" >/dev/null

      - name: Resolve immutable image digest
        id: digest
        run: |
          if [ -n "${{ inputs.image_digest }}" ]; then
            echo "image=${{ inputs.image_digest }}" >> "$GITHUB_OUTPUT"
            echo "Using provided digest: ${{ inputs.image_digest }}"
          else
            image="${{ env.REGISTRY_HOST }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}"
            echo "image=$image" >> "$GITHUB_OUTPUT"
            echo "Built and pushed: $image"
          fi

  deploy:
    name: Terraform agent deploy (no registry connection)
    needs: build
    runs-on: [self-hosted, linux, byor-private]
    env:
      ARM_CLIENT_ID: a24802c6-4286-4572-8733-377837098a2d
      ARM_TENANT_ID: 16b3c013-d300-468d-ac64-7eda0820b6d3
      ARM_SUBSCRIPTION_ID: 0e494a0c-e2e6-41f8-8a50-6064d842225e
      ARM_USE_OIDC: "true"
      TF_IN_AUTOMATION: "true"
      TF_VAR_project_endpoint: https://kaiser-foundry-resource.services.ai.azure.com/api/projects/workshop-demo-project
      TF_VAR_agent_name: docker-registry-anon-agent
      TF_VAR_image_uri: ${{ needs.build.outputs.image }}
      TF_VAR_model_deployment_name: ""
      TF_VAR_cpu: "0.5"
      TF_VAR_memory: "1Gi"
      TF_VAR_import_existing_agent: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: a24802c6-4286-4572-8733-377837098a2d
          tenant-id: 16b3c013-d300-468d-ac64-7eda0820b6d3
          subscription-id: 0e494a0c-e2e6-41f8-8a50-6064d842225e

      - name: Validate inputs
        run: |
          case "$TF_VAR_image_uri" in
            "${{ env.REGISTRY_HOST }}"/byor-agent-docker@sha256:*) ;;
            *)
              echo "::error::image_digest must be an immutable digest under ${{ env.REGISTRY_HOST }}/byor-agent-docker"
              exit 1
              ;;
          esac
          echo "Deploying image: $TF_VAR_image_uri"
          echo "No registry_connection_id will be set -- see infra/hosted-agent/main.tf"

      - name: Confirm registry is reachable anonymously (diagnostic only)
        run: |
          curl -fsS "https://${{ env.REGISTRY_HOST }}/v2/" && echo "Anonymous /v2/ ping succeeded from the private runner."

      - name: Terraform init (hosted-agent state)
        working-directory: infra/hosted-agent
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=kaiser-foundry-rg" \
            -backend-config="storage_account_name=tfstateb173d2d85c34" \
            -backend-config="container_name=docker-registry-agent-tfstate" \
            -backend-config="key=hosted-agent/proof.tfstate" \
            -backend-config="use_azuread_auth=true"

      - name: Terraform plan (adopt agent and create candidate version)
        working-directory: infra/hosted-agent
        run: terraform plan -input=false -out=tfplan

      - name: Terraform apply hosted agent
        working-directory: infra/hosted-agent
        run: |
          terraform apply -input=false tfplan
          rm -f tfplan

      - name: Capture candidate version
        id: agent
        working-directory: infra/hosted-agent
        run: |
          version="$(terraform output -raw agent_version)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Candidate version: $version"

      - name: Wait for and smoke test candidate
        run: |
          python3 scripts/test-hosted-agent.py \
            --endpoint "$TF_VAR_project_endpoint" \
            --agent "$TF_VAR_agent_name" \
            --version "${{ steps.agent.outputs.version }}" \
            --expected-image "$TF_VAR_image_uri" \
            --expected-model "$TF_VAR_model_deployment_name"
